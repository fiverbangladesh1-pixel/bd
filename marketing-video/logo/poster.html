h1{position:absolute;left:64px;right:64px;top:230px;font-weight:800;font-stretch:86%;font-size:118px;line-height:1.16}

.sub{position:absolute;left:64px;right:64px;top:530px;font-size:40px;font-weight:500;color:#d5e6dc;line-height:1.4}
.feat{position:absolute;left:64px;top:690px;width:520px;display:flex;flex-direction:column;gap:18px}

.feat svg{width:40px;height:40px;flex:none;stroke:#e0b64f;fill:none;stroke-width:2.200;stroke-linecap:round;stroke-linejoin:round}
.hero{position:absolute;right:-30px;top:650px;width:480px;height:480px;border-radius:50%;background:url(gen2/up_green_0.png) center/cover;box-shadow:0 0 0 5px #e0b64f,0 40px 140px rgba(220,175,60,.4)}
.cta{position:absolute;left:64px;right:64px;bottom:64px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.tg{display:flex;align-items:center;gap:18px;padding:12px 40px 12px 12px;border-radius:60px;background:linear-gradient(90deg,#2aabee,#1a82d6);font-family:Inter;font-weight:800;font-size:46px;letter-spacing:-.01em;box-shadow:0 20px 60px rgba(30,150,220,.45)}
.tg span{width:76px;height:76px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.tg svg{width:44px;height:44px;margin-left:-5px}
.msg{font-size:34px;font-weight:600;color:#e9d08c;text-align:right;line-height:1.3}
