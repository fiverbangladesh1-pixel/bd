<!doctype html>
<html><head><meta charset="utf-8"><title>E-Wallet Blue Marks</title>
<style>
@font-face{font-family:Anek;font-weight:100 800;font-stretch:75% 125%;src:url(../v2/fonts/anek-bangla-latin-standard-normal.woff2)}
@font-face{font-family:AnekB;font-weight:100 800;src:url(../v2/fonts/anek-bangla-bengali-standard-normal.woff2)}
@font-face{font-family:Inter;font-weight:100 900;src:url(../v2/fonts/inter-latin-wght-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#1557ff;--n:#0a1b4d}
body{width:2400px;background:#eef1f7;font-family:Inter,sans-serif;color:var(--n);padding:90px}
h1{font-weight:800;font-size:54px;letter-spacing:-.02em}
.p{font-family:AnekB,Inter;font-size:34px;color:#5b6787;margin-top:8px}
.rowx{display:grid;grid-template-columns:150px 1fr 1fr 1.5fr 1fr;gap:28px;margin-top:34px;align-items:stretch}
.num{background:var(--n);color:#fff;border-radius:32px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:90px}
.t{border-radius:32px;height:420px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.w{background:#fff;color:var(--b)}.bl{background:#fff}
.t svg{width:250px;height:250px}
.circ{width:320px;height:320px;border-radius:50%;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center}
.circ svg{width:190px;height:190px}
.lk{display:flex;align-items:center;gap:26px;color:var(--b)}
.lk svg{width:170px;height:170px}
.lk b{display:block;font-family:Inter;font-weight:800;font-size:92px;letter-spacing:-.035em;line-height:.95;color:var(--n)}
.lk span{display:block;font-weight:600;font-size:25px;letter-spacing:.42em;color:var(--b);margin-top:10px;padding-left:4px}
.sm{display:flex;align-items:center;gap:26px}
.sm .circ{flex:none}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <!-- 1: squircle E with card slots -->
  <mask id="k1" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240"><rect x="20" y="20" width="200" height="200" rx="56" fill="#fff"/>
    <path fill="#000" d="M103 72 a11 11 0 0 0 0 22 H240 V72 Z M103 146 a11 11 0 0 0 0 22 H240 V146 Z M172 90 a30 30 0 0 0 0 60 H240 V90 Z"/></mask>
  <symbol id="m1" viewBox="0 0 240 240"><rect width="240" height="240" fill="currentColor" mask="url(#k1)"/></symbol>
  <!-- 2: bracket + coin -->
  <symbol id="m2" viewBox="0 0 240 240"><path fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" d="M190 44 H84 a36 36 0 0 0 -36 36 V160 a36 36 0 0 0 36 36 H190"/><path fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" d="M48 120 H112"/><circle cx="172" cy="120" r="22" fill="currentColor"/></symbol>
  <!-- 3: bracket + arrow -->
  <symbol id="m3" viewBox="0 0 240 240"><path fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" d="M190 44 H84 a36 36 0 0 0 -36 36 V160 a36 36 0 0 0 36 36 H190"/><path fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" d="M48 120 H184 M154 90 L184 120 L154 150"/></symbol>
  <!-- 4: motion E -->
  <symbol id="m4" viewBox="0 0 240 240"><g fill="currentColor" transform="translate(26 0) skewX(-13)"><path d="M56 30 H206 a10 10 0 0 1 10 10 V62 a10 10 0 0 1 -10 10 H102 V98 H164 a10 10 0 0 1 10 10 V132 a10 10 0 0 1 -10 10 H102 V168 H206 a10 10 0 0 1 10 10 V200 a10 10 0 0 1 -10 10 H56 a10 10 0 0 1 -10 -10 V40 a10 10 0 0 1 10 -10 Z"/></g></symbol>
</defs></svg>
<div id="board">
<h1>E-WALLET — BLUE MARK CONCEPTS</h1><div class="p">সরল এক-রঙা চিহ্ন · নীল · পছন্দের নম্বরটি বলুন</div>
<script>
const names=['','কার্ড-স্লট E','E + কয়েন','E + তীর','গতিময় E'];
for(let i=1;i<=4;i++)document.write(`<div class="rowx"><div class="num">${i}</div>
 <div class="t w"><svg><use href="#m${i}"/></svg></div>
 <div class="t bl"><div class="circ"><svg><use href="#m${i}"/></svg></div></div>
 <div class="t w"><div class="lk"><svg><use href="#m${i}"/></svg><div><b>Wallet</b><span>SUPPORT</span></div></div></div>
 <div class="t w"><div class="sm">${[110,64,40].map(s=>`<div class="circ" style="width:${s}px;height:${s}px"><svg style="width:${s*.6}px;height:${s*.6}px"><use href="#m${i}"/></svg></div>`).join('')}</div></div></div>`);
</script>
</div>
</body></html>
