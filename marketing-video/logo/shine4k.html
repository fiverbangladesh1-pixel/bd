<!doctype html>
<html><head><meta charset="utf-8"><title>E-Wallet 4K</title>
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url(../v2/fonts/inter-latin-wght-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1100px;background:#333;font-family:Inter,sans-serif}
.lg{width:1024px;height:1024px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#18c8ff,#1546ff)}
.ct{position:relative;display:flex;flex-direction:column;align-items:center;color:#fff}
.ct svg{width:400px;height:400px;margin-top:-36px}
.ct .w{font-weight:900;font-size:172px;letter-spacing:-.03em;line-height:1;margin-top:8px}
.ct .s{font-weight:800;font-size:66px;letter-spacing:.34em;padding-left:.34em;margin-top:10px}
/* subtle shine only */
#shine .gl{position:absolute;inset:0;background:radial-gradient(60% 60% at 22% 12%,rgba(255,255,255,.2),rgba(255,255,255,0) 70%)}
#shine .rf{position:absolute;left:-30%;top:-62%;width:160%;height:100%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.035))}
#shine .ct{filter:drop-shadow(0 8px 14px rgba(6,30,150,.2))}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <mask id="k1" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240"><rect x="20" y="20" width="200" height="200" rx="56" fill="#fff"/>
    <path fill="#000" d="M103 72 a11 11 0 0 0 0 22 H240 V72 Z M103 146 a11 11 0 0 0 0 22 H240 V146 Z M172 90 a30 30 0 0 0 0 60 H240 V90 Z"/></mask>
  <symbol id="mw" viewBox="0 0 240 240"><rect width="240" height="240" fill="#fff" mask="url(#k1)"/></symbol>
</defs></svg>
<div class="lg" id="shine"><div class="gl"></div><div class="rf"></div><div class="ct"><svg><use href="#mw"/></svg><div class="w">WALLET</div><div class="s">SUPPORT</div></div></div>
<div class="lg" id="flat"><div class="ct"><svg><use href="#mw"/></svg><div class="w">WALLET</div><div class="s">SUPPORT</div></div></div>
</body></html>
