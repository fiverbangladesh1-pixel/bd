<!doctype html>
<html><head><meta charset="utf-8"><title>E-Wallet Lockup Colours</title>
<style>
@font-face{font-family:AnekB;font-weight:100 800;src:url(../v2/fonts/anek-bangla-bengali-standard-normal.woff2)}
@font-face{font-family:Inter;font-weight:100 900;src:url(../v2/fonts/inter-latin-wght-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:3200px;background:#eef1f7;font-family:Inter,AnekB,sans-serif;color:#0a1b4d}
#board{padding:90px;width:3200px}
h1{font-weight:800;font-size:60px;letter-spacing:-.02em}
.p{font-family:AnekB,Inter;font-size:38px;color:#5b6787;margin-top:8px}
.hd,.r{display:grid;grid-template-columns:110px repeat(8,1fr);gap:22px;margin-top:22px;align-items:stretch}
.hd{margin-top:44px}
.hd div{font-family:AnekB,Inter;font-size:27px;font-weight:600;color:#5b6787;text-align:center}
.num{background:#0a1b4d;color:#fff;border-radius:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:64px}
.t{border-radius:26px;height:250px;display:flex;align-items:center;justify-content:center;position:relative;border:6px solid transparent}
.t.rec{border-color:#12b76a;box-shadow:0 0 0 6px rgba(18,183,106,.25)}
.t .tag{position:absolute;left:50%;transform:translateX(-50%);top:-24px;background:#12b76a;color:#fff;font-family:AnekB,Inter;font-weight:700;font-size:24px;padding:5px 20px;border-radius:30px;white-space:nowrap;z-index:2}
.lk{display:flex;align-items:center;gap:calc(26px*var(--z,1))}
.lk svg{width:calc(170px*var(--z,1));height:calc(170px*var(--z,1));flex:none}
.lk b{display:block;font-weight:800;font-size:calc(92px*var(--z,1));letter-spacing:-.035em;line-height:.95}
.lk span{display:block;font-weight:600;font-size:calc(25px*var(--z,1));letter-spacing:.42em;margin-top:calc(10px*var(--z,1));padding-left:calc(4px*var(--z,1))}
.t .lk{--z:.56}
.note{margin-top:44px;background:#0a1b4d;color:#fff;border-radius:36px;padding:40px 52px;font-family:AnekB,Inter;font-size:40px;line-height:1.5}
.note b{color:#5fd2ff}
.fin{width:2400px;height:1200px;display:flex;align-items:center;justify-content:center}
.fin .lk{--z:2.6}
.sq{width:2048px;height:2048px;display:flex;align-items:center;justify-content:center}
.sq .lk{--z:2.1;flex-direction:column;gap:70px;text-align:center}
.sq .lk svg{width:760px;height:760px}
.sq .lk span{padding-left:.42em}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <mask id="k1" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240"><rect x="20" y="20" width="200" height="200" rx="56" fill="#fff"/>
    <path fill="#000" d="M103 72 a11 11 0 0 0 0 22 H240 V72 Z M103 146 a11 11 0 0 0 0 22 H240 V146 Z M172 90 a30 30 0 0 0 0 60 H240 V90 Z"/></mask>
  <symbol id="m1" viewBox="0 0 240 240"><rect width="240" height="240" fill="currentColor" mask="url(#k1)"/></symbol>
  <symbol id="m2" viewBox="0 0 240 240"><path fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" d="M190 44 H84 a36 36 0 0 0 -36 36 V160 a36 36 0 0 0 36 36 H190"/><path fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" d="M48 120 H112"/><circle cx="172" cy="120" r="22" fill="currentColor"/></symbol>
  <symbol id="m3" viewBox="0 0 240 240"><path fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" d="M190 44 H84 a36 36 0 0 0 -36 36 V160 a36 36 0 0 0 36 36 H190"/><path fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" d="M48 120 H184 M154 90 L184 120 L154 150"/></symbol>
  <symbol id="m4" viewBox="0 0 240 240"><g fill="currentColor" transform="translate(26 0) skewX(-13)"><path d="M56 30 H206 a10 10 0 0 1 10 10 V62 a10 10 0 0 1 -10 10 H102 V98 H164 a10 10 0 0 1 10 10 V132 a10 10 0 0 1 -10 10 H102 V168 H206 a10 10 0 0 1 10 10 V200 a10 10 0 0 1 -10 10 H56 a10 10 0 0 1 -10 -10 V40 a10 10 0 0 1 10 -10 Z"/></g></symbol>
</defs></svg>
<div id="board"></div><div id="finals"></div>
<script>
const C=[
 {k:'white-blue',n:'সাদা + নীল',bg:'#ffffff',m:'#1557ff',t:'#0a1b4d',s:'#1557ff'},
 {k:'blue',n:'ইলেকট্রিক নীল',bg:'#1557ff',m:'#fff',t:'#fff',s:'#cfe0ff'},
 {k:'gradient',n:'নীল-সায়ান',bg:'linear-gradient(135deg,#18c8ff,#1546ff)',m:'#fff',t:'#fff',s:'#e2f6ff'},
 {k:'navy-blue',n:'নেভি + নীল',bg:'#07153f',m:'#2f7bff',t:'#fff',s:'#7fb0ff'},
 {k:'navy-lime',n:'নেভি + লাইম',bg:'#07153f',m:'#c8ff3d',t:'#fff',s:'#c8ff3d'},
 {k:'green',n:'পান্না সবুজ',bg:'#0aa35c',m:'#fff',t:'#fff',s:'#d3f7e5'},
 {k:'orange',n:'কমলা',bg:'#ff5a1f',m:'#fff',t:'#fff',s:'#ffe1d4'},
 {k:'black-gold',n:'কালো + সোনালি',bg:'#0b0b0d',m:'#f2c14e',t:'#fff',s:'#f2c14e'},
];
const q=new URLSearchParams(location.search),RM=+(q.get('m')||1),RC=q.get('c')||'gradient';
const lk=(i,c)=>`<div class="lk"><svg style="color:${c.m}"><use href="#m${i}"/></svg><div><b style="color:${c.t}">Wallet</b><span style="color:${c.s}">SUPPORT</span></div></div>`;
let h=`<h1>E-WALLET — LOGO COLOUR VARIANTS</h1><div class="p">চারটা লোগো × আটটা রঙ · সারি = লোগো নম্বর, কলাম = রঙ (ক–জ)</div><div class="hd"><div></div>${C.map((c,j)=>`<div>${'কখগঘঙচছজ'[j]} · ${c.n}</div>`).join('')}</div>`;
for(let i=1;i<=4;i++)h+=`<div class="r"><div class="num">${i}</div>${C.map(c=>{const r=i===RM&&c.k===RC;return `<div class="t ${r?'rec':''}" style="background:${c.bg};${c.bg==='#ffffff'?'box-shadow:inset 0 0 0 2px #dfe4f0':''}">${r?'<div class="tag">★ আমার সুপারিশ</div>':''}${lk(i,c)}</div>`}).join('')}</div>`;
const rc=C.find(c=>c.k===RC),rj=C.indexOf(rc);
h+=`<div class="note">সুপারিশ: <b>${RM} নম্বর লোগো, ${'কখগঘঙচছজ'[rj]} রঙ (${rc.n})</b>। ${RM} নম্বরের চিহ্নটা সবচেয়ে ভরাট, তাই ছোট সাইজেও স্পষ্ট থাকে; আর এই রঙটা ডার্ক ও লাইট — দুই থিমেই উজ্জ্বল দেখায়। সাদা কাগজ, ইনভয়েস বা ওয়েবসাইটের জন্য একই লোগোর <b>ক রঙ (সাদা + নীল)</b> ব্যবহার করুন।</div>`;
document.getElementById('board').innerHTML=h;
let f='';for(let i=1;i<=4;i++)for(const c of C)f+=`<div class="fin" id="f_${i}_${c.k}" style="background:${c.bg}">${lk(i,c)}</div>`;
f+=`<div class="sq" id="sq" style="background:${rc.bg}">${lk(RM,rc)}</div><div class="sq" id="ic" style="background:${rc.bg};color:${rc.m}"><svg style="width:1180px;height:1180px"><use href="#m${RM}"/></svg></div>`;
document.getElementById('finals').innerHTML=f;
</script>
</body></html>
