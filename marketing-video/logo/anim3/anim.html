<!doctype html>
<html><head><meta charset="utf-8"><title>E-Wallet Logo Build</title>
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url(../../v2/fonts/inter-latin-wght-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1024px;height:1024px;overflow:hidden;background:#1546ff;font-family:Inter,sans-serif}
#lg{width:1024px;height:1024px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#18c8ff,#1546ff)}
.blob{position:absolute;width:900px;height:900px;border-radius:50%;left:62px;top:62px}
#b1{background:radial-gradient(closest-side,rgba(120,235,255,.5),rgba(120,235,255,0))}
#b2{background:radial-gradient(closest-side,rgba(10,30,200,.5),rgba(10,30,200,0))}
#gl{position:absolute;inset:0;background:radial-gradient(60% 60% at 22% 12%,rgba(255,255,255,.2),rgba(255,255,255,0) 70%)}
#rf{position:absolute;left:-30%;top:-62%;width:160%;height:100%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.035))}
.bk{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.5),rgba(255,255,255,0));left:0;top:0}
#ct{position:relative;display:flex;flex-direction:column;align-items:center;color:#fff;filter:drop-shadow(0 10px 16px rgba(6,30,150,.24))}
#ewrap{width:400px;height:400px;margin-top:-36px;perspective:1100px;position:relative}
#emove{width:400px;height:400px;position:relative;transform-style:preserve-3d}
#e{width:400px;height:400px;overflow:visible;display:block}
.ring{position:absolute;left:200px;top:200px;width:0;height:0}
.ring i{position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;border:4px solid #fff;opacity:0;display:block}
#cring{left:286.700px}#cring i,#cring2 i{left:-50px;top:-50px;width:100px;height:100px;border-width:5px}#cring2{left:286.700px}
#wbox{position:relative;margin-top:8px}
#w,#wsh{font-weight:900;font-size:172px;letter-spacing:-.03em;line-height:1;white-space:nowrap}
#w{display:flex}
.lw{display:inline-block;overflow:hidden;padding:0 .04em;margin:0 -.04em}
.lw span{display:inline-block}
#wsh{position:absolute;left:0;top:0;color:#8fd2ff;clip-path:polygon(-30% 0,-30% 0,-30% 100%,-30% 100%)}
#srow{margin-top:10px}
#s{font-weight:800;font-size:66px;letter-spacing:.34em;padding-left:.34em;white-space:nowrap;opacity:0}
</style></head><body>
<div id="lg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div id="gl"></div><div id="rf"></div><div id="bks"></div>
  <div id="ct">
    <div id="ewrap"><div id="emove">
      <svg id="e" viewBox="0 0 240 240">
        <defs><mask id="k" maskUnits="userSpaceOnUse" x="-200" y="-100" width="640" height="440">
          <rect id="base" x="106" y="106" width="28" height="28" rx="14" fill="#fff"/>
          <g fill="#000"><path id="sl1" d="M103 72 a11 11 0 0 0 0 22 H240 V72 Z"/><path id="sl2" d="M103 146 a11 11 0 0 0 0 22 H240 V146 Z"/><path id="notch" d="M172 90 a30 30 0 0 0 0 60 H240 V90 Z"/></g></mask></defs>
        <g mask="url(#k)"><rect x="-200" y="-100" width="640" height="440" fill="#fff"/>
          <rect id="band" x="-140" y="-40" width="54" height="320" fill="#9bd8ff" transform="skewX(-22)" opacity=".95"/>
          <rect id="band2" x="-140" y="-40" width="14" height="320" fill="#9bd8ff" transform="skewX(-22)" opacity=".8"/></g>
        <circle id="coin" cx="372" cy="120" r="19" fill="#fff" opacity="0"/>
      </svg>
      <div class="ring" id="r1"><i></i></div><div class="ring" id="r2"><i></i></div>
      <div class="ring" id="cring"><i></i></div><div class="ring" id="cring2"><i></i></div>
    </div></div>
    <div id="wbox"><div id="w">WALLET</div><div id="wsh">WALLET</div></div>
    <div id="srow"><div id="s">SUPPORT</div></div>
  </div>
</div>
<script src="../../v2/lib/gsap.min.js"></script>
<script>
const $=s=>document.querySelector(s),D=8;
const w=$('#w');w.innerHTML=[...w.textContent].map(c=>`<span class="lw"><span>${c}</span></span>`).join('');
const L=[...document.querySelectorAll('#w .lw span')];
// soft bokeh
const R=(()=>{let s=11;return()=>(s=(s*16807)%2147483647)/2147483647})();
const BK=[...Array(9)].map(()=>{const d=document.createElement('div');d.className='bk';const z=30+R()*110;d.style.width=d.style.height=z+'px';d.style.opacity=.1+R()*.22;$('#bks').appendChild(d);return{d,x:R()*1024,y:R()*1024,ph:R()*6.28,r:30+R()*60,k:1+Math.floor(R()*2)}});
gsap.defaults({ease:'expo.out'});
const tl=gsap.timeline({paused:true});
const A=(sel,attr,dur,ease,at)=>tl.to(sel,{attr,duration:dur,ease},at);
const DOT={x:106,y:106,width:28,height:28,rx:14},PILL={x:52,y:100,width:136,height:40,rx:20},SQ={x:20,y:20,width:200,height:200,rx:56};
// initial states (t=0 : empty brand field)
gsap.set('#emove',{y:158,scale:1.24,rotationX:0,rotationY:0,transformOrigin:'50% 50%'});
gsap.set('#e',{scale:0,transformOrigin:'50% 50%'});
gsap.set(['#sl1','#sl2'],{scaleX:0,transformOrigin:'240px 50%'});gsap.set('#notch',{scale:0,transformOrigin:'172px 120px'});
gsap.set(L,{yPercent:112,rotation:7,transformOrigin:'0% 100%'});
gsap.set('#s',{opacity:0,letterSpacing:'59px',paddingLeft:'59px'});
// ---------- BUILD ----------
tl.to('#e',{scale:1,duration:.5,ease:'back.out(2.6)'},.3);
tl.fromTo('#r1 i',{scale:.15,opacity:.9},{scale:1.5,opacity:0,duration:.9,ease:'power2.out',immediateRender:false},.34);
A('#base',PILL,.38,'expo.inOut',.72);
A('#base',SQ,.62,'back.out(1.5)',1.02);
tl.fromTo('#emove',{rotationY:-38,rotationX:22},{rotationY:0,rotationX:0,duration:1.2,ease:'expo.out',immediateRender:false},1.02);
tl.to('#sl1',{scaleX:1,duration:.5,ease:'expo.out'},1.36).to('#sl2',{scaleX:1,duration:.5,ease:'expo.out'},1.46)
  .to('#notch',{scale:1,duration:.5,ease:'back.out(2.6)'},1.66);
tl.fromTo('#r2 i',{scale:.6,opacity:.75},{scale:2.3,opacity:0,duration:1.1,ease:'power2.out',immediateRender:false},1.66);
const shineE=at=>{tl.fromTo('#band',{attr:{x:-140}},{attr:{x:420},duration:.9,ease:'power2.inOut',immediateRender:false},at).fromTo('#band2',{attr:{x:-140}},{attr:{x:420},duration:.9,ease:'power2.inOut',immediateRender:false},at+.13)};
shineE(1.8);
// settle into the lockup
tl.to('#emove',{y:0,scale:1,duration:.95,ease:'expo.inOut'},1.95);
tl.to(L,{yPercent:0,rotation:0,duration:.8,ease:'expo.out',stagger:.05},2.4);
tl.to('#s',{opacity:1,letterSpacing:'22.44px',paddingLeft:'22.44px',duration:1.1,ease:'expo.out'},2.75);
// ---------- HOLD ----------
const ps={p:-30};const clip=()=>{$('#wsh').style.clipPath=`polygon(${ps.p}% 0,${ps.p+13}% 0,${ps.p+5}% 100%,${ps.p-8}% 100%)`};
const shineW=at=>tl.fromTo(ps,{p:-30},{p:135,duration:1.0,ease:'power2.inOut',onUpdate:clip,immediateRender:false},at);
shineE(3.55);shineW(3.72);
tl.to('#ct',{y:-7,duration:1.3,ease:'sine.inOut',yoyo:true,repeat:1},3.5);
// coin drops into the wallet notch
tl.to('#coin',{opacity:1,duration:.14,ease:'none'},4.7).to('#coin',{attr:{cx:172},duration:.6,ease:'power3.in'},4.7)
  .to('#coin',{attr:{r:30},duration:.1,ease:'power1.out'},5.3).set('#notch',{scale:0},5.34).set('#coin',{opacity:0},5.34)
  .to('#e',{scaleX:.93,scaleY:1.06,duration:.1,ease:'power2.out'},5.3).to('#e',{scaleX:1,scaleY:1,duration:.7,ease:'elastic.out(1,.45)'},5.4)
  .fromTo('#cring i',{scale:.5,opacity:.85},{scale:4.2,opacity:0,duration:1,ease:'power2.out',immediateRender:false},5.34)
  .fromTo('#cring2 i',{scale:.5,opacity:.6},{scale:6.4,opacity:0,duration:1.3,ease:'power2.out',immediateRender:false},5.46)
  .to('#notch',{scale:1,duration:.5,ease:'back.out(2.2)'},5.75).set('#coin',{attr:{r:19,cx:372}},6);
// ---------- OUT (returns to the empty field for a seamless loop) ----------
tl.to('#s',{opacity:0,letterSpacing:'46px',paddingLeft:'46px',duration:.4,ease:'power2.in'},6.6);
tl.to(L,{yPercent:112,duration:.45,ease:'expo.in',stagger:{each:.035,from:'end'}},6.65);
tl.to(['#sl1','#sl2'],{scaleX:0,duration:.3,ease:'expo.in'},6.9).to('#notch',{scale:0,duration:.25,ease:'power2.in'},6.9);
tl.to('#emove',{y:158,scale:1.24,duration:.55,ease:'expo.inOut'},6.85);
A('#base',PILL,.3,'expo.in',7.15);A('#base',DOT,.2,'expo.out',7.45);
tl.to('#e',{scale:0,duration:.22,ease:'back.in(2.4)'},7.6);
tl.set({},{},D);
window.prep=async()=>{await document.fonts.ready;tl.time(0)};
window.seek=t=>{t=((t%D)+D)%D;tl.time(t);
  const a=2*Math.PI*t/D;
  $('#b1').style.transform=`translate(${-260+170*Math.cos(a)}px,${-300+150*Math.sin(a)}px)`;
  $('#b2').style.transform=`translate(${300+160*Math.cos(a+Math.PI)}px,${340+150*Math.sin(a+Math.PI)}px)`;
  $('#gl').style.transform=`translate(${40*Math.cos(a)}px,${30*Math.sin(a)}px)`;
  $('#rf').style.transform=`translateY(${14*Math.sin(a*2)}px) rotate(${1.2*Math.sin(a)}deg)`;
  for(const b of BK)b.d.style.transform=`translate(${b.x+b.r*Math.cos(a*b.k+b.ph)}px,${b.y+b.r*Math.sin(a*b.k+b.ph)}px)`;
};
</script>
</body></html>
