<!doctype html>
<html><head><meta charset="utf-8"><title>E-Wallet Polished</title>
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url(../v2/fonts/inter-latin-wght-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:2200px;background:#333;font-family:Inter,sans-serif}
.lg{width:1024px;height:1024px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(70% 70% at 24% 14%,rgba(255,255,255,.42),rgba(255,255,255,0) 62%),radial-gradient(80% 80% at 92% 100%,rgba(6,18,140,.7),rgba(6,18,140,0) 65%),linear-gradient(135deg,#19ccff 0%,#1a86ff 46%,#1440ff 100%)}
.lg .dome{position:absolute;left:-22%;right:-22%;top:-58%;height:100%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.05) 75%,rgba(255,255,255,0))}
.lg .ring{position:absolute;inset:20px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.28),inset 0 22px 50px rgba(255,255,255,.16),inset 0 -40px 80px rgba(4,14,120,.35)}
.lg .streak{position:absolute;top:-30%;bottom:-30%;left:36%;width:150px;transform:rotate(24deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.2),rgba(255,255,255,0))}
.lg .streak.b{left:53%;width:46px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.16),rgba(255,255,255,0))}
.ct{position:relative;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 18px 26px rgba(4,24,150,.42)) drop-shadow(0 2px 2px rgba(4,24,150,.25))}
.ct svg{width:400px;height:400px;margin-top:-36px}
.ct .w{font-weight:900;font-size:172px;letter-spacing:-.03em;line-height:1;margin-top:8px;background-image:linear-gradient(180deg,#ffffff 30%,#d3ecff 100%);-webkit-background-clip:text;color:transparent}
.ct .s{font-weight:800;font-size:66px;letter-spacing:.34em;padding-left:.34em;margin-top:10px;color:#f1faff}
.glint{position:absolute;color:#fff;filter:drop-shadow(0 0 14px rgba(255,255,255,.9))}
/* flat original for reference input */
#flat{background:linear-gradient(135deg,#18c8ff,#1546ff)}
#flat .ct{filter:none}#flat .w{background:none;color:#fff}#flat .s{color:#fff}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset=".2" stop-color="#fff"/><stop offset="1" stop-color="#d3ecff"/></linearGradient>
  <mask id="k1" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240"><rect x="20" y="20" width="200" height="200" rx="56" fill="#fff"/>
    <path fill="#000" d="M103 72 a11 11 0 0 0 0 22 H240 V72 Z M103 146 a11 11 0 0 0 0 22 H240 V146 Z M172 90 a30 30 0 0 0 0 60 H240 V90 Z"/></mask>
  <symbol id="mg" viewBox="0 0 240 240"><rect width="240" height="240" fill="url(#wg)" mask="url(#k1)"/></symbol>
  <symbol id="mw" viewBox="0 0 240 240"><rect width="240" height="240" fill="#fff" mask="url(#k1)"/></symbol>
  <symbol id="star" viewBox="0 0 40 40"><path fill="currentColor" d="M20 0 C21 12 28 19 40 20 C28 21 21 28 20 40 C19 28 12 21 0 20 C12 19 19 12 20 0Z"/></symbol>
</defs></svg>
<div class="lg" id="shine"><div class="dome"></div><div class="streak"></div><div class="streak b"></div>
  <div class="ct"><svg><use href="#mg"/></svg><div class="w">WALLET</div><div class="s">SUPPORT</div></div>
  <svg class="glint" style="left:676px;top:168px;width:58px;height:58px"><use href="#star"/></svg>
  <svg class="glint" style="left:738px;top:228px;width:24px;height:24px;opacity:.85"><use href="#star"/></svg>
  <div class="ring"></div></div>
<div class="lg" id="flat"><div class="ct"><svg><use href="#mw"/></svg><div class="w">WALLET</div><div class="s">SUPPORT</div></div></div>
</body></html>
